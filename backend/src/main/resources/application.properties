spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MoPaKa78}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-before-deploying-1234567890}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
app.jwt.issuer=${JWT_ISSUER:employee-management}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:hr-employee-activity-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.employeemanagement.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.employeemanagement.kafka.EmployeeActivityEvent

app.kafka.employee-events-topic=${EMPLOYEE_EVENTS_TOPIC:hr.employee.events}
app.kafka.timeclock-events-topic=${TIMECLOCK_EVENTS_TOPIC:hr.timeclock.events}
app.kafka.timeclock-consumer-group=${TIMECLOCK_KAFKA_CONSUMER_GROUP:hr-timeclock-event-consumer}

# --- AI / HR Knowledge Assistant ---
# AI is off by default; the app starts normally either way, and AI endpoints return
# a structured 503 AI_DISABLED response until AI_ENABLED=true and AI_API_KEY is set.
ai.enabled=${AI_ENABLED:false}
ai.provider=${AI_PROVIDER:openai}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.base-url=${AI_BASE_URL:https://api.openai.com}
ai.temperature=${AI_TEMPERATURE:0.2}
ai.max-tokens=${AI_MAX_TOKENS:800}
ai.top-k=${AI_TOP_K:5}
ai.similarity-threshold=${AI_SIMILARITY_THRESHOLD:0.5}

# Embeddings run locally via a Hugging Face model (sentence-transformers/
# all-MiniLM-L6-v2, ONNX) regardless of the chat provider above - no API key needed.
# It's fetched once on first use and cached here; fully offline after that.
ai.embedding.cache-directory=${AI_EMBEDDING_CACHE_DIR:./data/onnx-model-cache}

# Policy conflict review (PolicyConflictReviewService): before an admin activates a
# document, it's compared against other already-active documents for contradictions.
# Higher similarity-threshold than AI_SIMILARITY_THRESHOLD above, since this is
# picking candidate pairs worth asking the model about, not answering a question.
ai.conflict-review-similarity-threshold=${AI_CONFLICT_REVIEW_SIMILARITY_THRESHOLD:0.55}
# Caps how many of the new document's own chunks are compared, to bound cost on
# very large documents.
ai.conflict-review-max-chunks=${AI_CONFLICT_REVIEW_MAX_CHUNKS:20}
# Caps how many candidate (new-chunk, existing-chunk) pairs are sent to the model
# in one review call, keeping the prompt (and cost) bounded regardless of how many
# candidates were found above.
ai.conflict-review-max-candidate-pairs=${AI_CONFLICT_REVIEW_MAX_CANDIDATE_PAIRS:15}

# Local policy-document storage. Temporary — replaced by Amazon S3 in a future phase.
app.hr-documents.storage-path=${HR_DOCUMENT_STORAGE_PATH:./data/hr-policy-documents}
app.hr-documents.max-upload-bytes=${HR_DOCUMENT_MAX_UPLOAD_BYTES:10485760}

# Seeds a starter set of general workplace policy documents (code of conduct,
# attendance, leave, benefits, remote work, security, compensation) the first time
# the policy library is empty, so the HR assistant has something to answer from
# out of the box. Set to false to skip and manage policies manually from day one.
app.hr-documents.seed-defaults=${HR_DOCUMENT_SEED_DEFAULTS:true}

# Hard servlet-level ceiling (generous). The real, configurable limit is enforced
# in LocalDocumentStorageService against app.hr-documents.max-upload-bytes.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
