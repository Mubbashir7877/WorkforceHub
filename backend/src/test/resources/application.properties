# Test-only configuration. Shadows src/main/resources/application.properties on the
# test classpath so the suite runs entirely against an in-memory H2 database - no
# MySQL instance, and no real secrets, are ever required to run `mvnw test`.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.cors.allowed-origins=http://localhost:5173

app.jwt.secret=test-only-secret-key-not-for-production-use-please-1234567890
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.issuer=employee-management-test

app.initial-admin.email=
app.initial-admin.password=
